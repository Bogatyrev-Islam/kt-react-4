<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>React App</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g., https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // Note: this 404.html file must be at least 512 bytes for it to work
      // with Internet Explorer (it is currently > 512 bytes)

      // If you're creating a Project Pages site and NOT using a custom domain,
      // then set pathSegmentsToKeep to 1 (enterprise users may need to set it to > 1).
      // This way the code will only replace the route part and not the real directory.
      // Say your project is https://username.github.io/myproject, it is served from
      // https://username.github.io/myproject/ (notice the /), and has the following
      // routes:
      // https://username.github.io/myproject/ (home)
      // https://username.github.io/myproject/one
      // https://username.github.io/myproject/one/two
      // https://username.github.io/myproject/one/two?q=param
      // https://username.github.io/myproject/one/two#hash
      // If you set pathSegmentsToKeep to 1, then the script will not replace the
      // /myproject/ part of the path. So the above routes become:
      // https://username.github.io/myproject/? (home)
      // https://username.github.io/myproject/?/one
      // https://username.github.io/myproject/?/one/two
      // https://username.github.io/myproject/?/one/two&q=param
      // https://username.github.io/myproject/?/one/two#hash
      // Otherwise, the /myproject/ part is replaced too, so the routes become:
      // https://username.github.io/? (home)
      // https://username.github.io/?/myproject/one
      // etc. Which would require you to configure your server to handle /myproject/
      // as well, which is not always possible or desirable.

      // If you're using a custom domain, you can set pathSegmentsToKeep to 0 (zero);
      // this way the path will be entirely replaced by a query string, e.g.,
      // https://www.foo.tld/one/two?a=b&c=d#qwe becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      // However, the custom domain must serve the 404.html file from its root.

      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );

    </script>
  </head>
  <body>
  </body>
</html>
